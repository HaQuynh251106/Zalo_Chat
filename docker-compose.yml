version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: zalo_pg
    environment:
      POSTGRES_USER: zalo
      POSTGRES_PASSWORD: zalo
      POSTGRES_DB: zalo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zalo -d zalo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zalo_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    container_name: zalo_nats
    ports:
      - "4222:4222"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zalo_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://zalo:zalo@postgres:5432/zalo?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "dev-secret-change-me"
      ALLOWED_ORIGINS: "*"
      UPLOAD_DIR: "/app/uploads"
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"

volumes:
  pgdata:
  uploads:
